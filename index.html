<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERIS</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#05080d;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    width:90%;
    max-width:500px;
}

h1{
    font-size:48px;
    letter-spacing:10px;
    color:#00d9ff;
    text-shadow:0 0 20px #00d9ff;
}

.status{
    color:#00d9ff;
    letter-spacing:2px;
    margin-top:-10px;
}

.circle{
    width:200px;
    height:200px;
    margin:50px auto;
    border:2px solid #00d9ff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 30px #00d9ff;
}

.inner{
    width:120px;
    height:120px;
    border:2px solid white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#00d9ff;
}

.message{
    padding:20px;
    border:1px solid #183746;
    border-radius:12px;
    background:#081018;
    margin-bottom:20px;
}

button{
    padding:14px 30px;
    border-radius:30px;
    border:1px solid #00d9ff;
    background:transparent;
    color:#00d9ff;
    font-size:16px;
}
</style>
</head>

<body>

<div class="container">

<h1>AERIS</h1>

<div class="status">
AERIS ONLINE
</div>

<div class="circle">
<div class="inner">
AERIS
</div>
</div>

<div class="message">
বাংলায় কথা বলুন...
</div>

<button>
🎙️ কথা বলুন
</button>

</div>

</body>
</html>
