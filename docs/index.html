<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERIS - AI Assistant</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#05070c;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:25px;
}

h1{
  font-size:42px;
  letter-spacing:8px;
  margin-bottom:5px;
}

.status{
  color:#00eaff;
  font-size:14px;
  letter-spacing:3px;
  margin-bottom:45px;
}

.circle{
  width:220px;
  height:220px;
  margin:auto;
  border-radius:50%;
  border:2px solid #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    0 0 60px rgba(0,234,255,.35),
    inset 0 0 40px rgba(0,234,255,.2);

  display:flex;
  justify-content:center;
  align-items:center;
  transition: all 0.3s ease;
}

.inner{
  width:150px;
  height:150px;
  border-radius:50%;
  background:#07121a;
  border:1px solid #00eaff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  letter-spacing:4px;
  box-shadow:0 0 30px rgba(0,234,255,.4);
}

.message{
  min-height:60px;
  margin-top:40px;
  font-size:18px;
  line-height:1.6;
}

button{
  margin-top:25px;
  padding:15px 30px;
  border:none;
  border-radius:30px;
  background:#00eaff;
  color:#001015;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition: 0.2s;
}

button:active{
  transform:scale(.96);
}

.listening{
  background:#ff3158;
  color:white;
}

.speaking {
  animation: pulse 1.2s infinite ease-in-out;
  border-color: #00ffaa;
  box-shadow: 0 0 30px #00ffaa, 0 0 80px rgba(0,255,170,.4);
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">

  <h1>AERIS</h1>

  <div class="status" id="status">
    AERIS ONLINE
  </div>

  <div class="circle" id="circle">
    <div class="inner" id="core">
      AERIS
    </div>
  </div>

  <div class="message" id="message">
    বাংলায় কথা বলুন...
  </div>

  <button id="talkButton">
    🎙️ কথা বলুন
  </button>

</div>

<script>

const button = document.getElementById("talkButton");
const message = document.getElementById("message");
const statusText = document.getElementById("status");
const circle = document.getElementById("circle");

// ১. ভয়েস ইঞ্জিন লোড করা
let voices = [];
function loadVoices() {
  if ('speechSynthesis' in window) {
    voices = window.speechSynthesis.getVoices();
  }
}
loadVoices();
if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

// ২. উন্নত Text-to-Speech (TTS) ফাংশন
function speak(text) {
  if (!('speechSynthesis' in window)) return;

  window.speechSynthesis.cancel(); // আগের কথা বন্ধ করা

  const utterance = new SpeechSynthesisUtterance(text);
  
  // বাংলা ভয়েস খোঁজা
  const bnVoice = voices.find(voice => voice.lang.includes('bn') || voice.lang.includes('BD'));
  if (bnVoice) {
    utterance.voice = bnVoice;
  }
  
  utterance.lang = "bn-BD"; 
  utterance.rate = 0.9; 

  utterance.onstart = function() {
    circle.classList.add("speaking");
    statusText.innerText = "AERIS SPEAKING";
  };

  utterance.onend = function() {
    circle.classList.remove("speaking");
    statusText.innerText = "AERIS ONLINE";
  };

  utterance.onerror = function(e) {
    console.log("TTS Error:", e);
    circle.classList.remove("speaking");
    statusText.innerText = "AERIS ONLINE";
  };

  window.speechSynthesis.speak(utterance);
}

// ৩. স্পিচ রিকগনিশন
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if (!SpeechRecognition) {
  message.innerText = "আপনার ব্রাউজারে Speech Recognition সাপোর্ট নেই। Chrome ব্যবহার করুন।";
  button.disabled = true;
} else {

  recognition = new SpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){
    button.innerText = "🔴 শুনছি...";
    button.classList.add("listening");
    statusText.innerText = "AERIS LISTENING";
  };

  recognition.onresult = function(event){
    const text = event.results[0][0].transcript.trim();
    message.innerText = "আপনি: " + text;
    reply(text);
  };

  recognition.onerror = function(event){
    console.log("Speech error:", event.error);
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");
    statusText.innerText = "AERIS ONLINE";

    if(event.error === "not-allowed"){
      message.innerText = "মাইক্রোফোন অনুমতি দেওয়া হয়নি।";
    } else {
      message.innerText = "কথা বোঝা যায়নি, আবার চেষ্টা করুন।";
    }
  };

  recognition.onend = function(){
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");
  };
}

button.addEventListener("click", function(){
  if(!recognition) return;
  try{
    // মোবাইলের অডিও পারমিশন এনাবল করার জন্য ট্রিক
    if ('speechSynthesis' in window) {
      window.speechSynthesis.resume();
    }
    recognition.start();
  }catch(error){
    console.log(error);
  }
});

// ৪. নমনীয় উত্তর লজিক (Flexible Matching)
function reply(text){
  let answer = "";

  if(text.includes("হ্যালো") || text.includes("হাই") || text.includes("হেলো")){
    answer = "হ্যালো! আমি এরিস। আপনাকে কীভাবে সাহায্য করতে পারি?";
  }
  else if(text.includes("কেমন")){
    answer = "আমি ভালো আছি। আপনার দিনটি কেমন যাচ্ছে?";
  }
  else if(text.includes("নাম")){
    answer = "আমার নাম এরিস।";
  }
  else if(text.includes("কে তুমি") || text.includes("তুমি কে")){
    answer = "আমি এরিস, আপনার নিজস্ব এআই সহকারী।";
  }
  else if(text.includes("সময়") || text.includes("কয়টা") || text.includes("বাজে")){
    const now = new Date();
    const timeString = now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
    answer = "এখন সময় " + timeString;
  }
  else if(text.includes("তারিখ") || text.includes("দিন")){
    const now = new Date();
    const dateString = now.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    answer = "আজকে " + dateString;
  }
  else if(text.includes("ধন্যবাদ")){
    answer = "আপনাকেও অনেক ধন্যবাদ!";
  }
  else{
    answer = "হ্যালো, আমি আপনার কথা শুনতে পেয়েছি। খুব শীঘ্রই আমি সব প্রশ্নের উত্তর দেওয়ার ক্ষমতা অর্জন করব।";
  }

  message.innerText = "AERIS: " + answer;
  speak(answer);
}

</script>

</body>
</html>
