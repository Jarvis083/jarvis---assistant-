<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOFIZ - AI Assistant</title>

<style>
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; background:#05070c; color:white;
  font-family:Arial,sans-serif; display:flex; justify-content:center;
  align-items:center; text-align:center;
}
.container{ width:100%; max-width:500px; padding:25px; }
h1{ font-size:42px; letter-spacing:8px; margin-bottom:5px; color:#00eaff; }
.status{ color:#00eaff; font-size:14px; letter-spacing:3px; margin-bottom:45px; }
.circle{
  width:220px; height:220px; margin:auto; border-radius:50%;
  border:2px solid #00eaff;
  box-shadow: 0 0 20px #00eaff, 0 0 60px rgba(0,234,255,.35), inset 0 0 40px rgba(0,234,255,.2);
  display:flex; justify-content:center; align-items:center; transition: all 0.3s ease;
}
.inner{
  width:150px; height:150px; border-radius:50%; background:#07121a;
  border:1px solid #00eaff; display:flex; justify-content:center; align-items:center;
  font-size:22px; font-weight:bold; letter-spacing:3px; box-shadow:0 0 30px rgba(0,234,255,.4);
}
.message{ min-height:60px; margin-top:40px; font-size:18px; line-height:1.6; word-break: break-word; }
button{
  margin-top:25px; padding:15px 30px; border:none; border-radius:30px;
  background:#00eaff; color:#001015; font-size:17px; font-weight:bold; cursor:pointer;
  transition: 0.2s;
}
button:active{ transform:scale(.96); }
.listening{ background:#ff3158; color:white; }
.thinking{ background:#ffb700; color:#000; }
.speaking {
  animation: pulse 1.2s infinite ease-in-out;
  border-color: #00ffaa;
  box-shadow: 0 0 30px #00ffaa, 0 0 80px rgba(0,255,170,.4);
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
  <h1>MOFIZ</h1>
  <div class="status" id="status">MOFIZ ONLINE</div>
  <div class="circle" id="circle">
    <div class="inner" id="core">MOFIZ</div>
  </div>
  <div class="message" id="message">কথা বলতে বাটনে চাপুন...</div>
  <button id="talkButton">🎙️ কথা বলুন</button>
</div>

<script>
// ⚠️ আপনার তৈরি করা নতুন GEMINI API KEY-টি এখানে বসাবেন
const GEMINI_API_KEY = "AQ.Ab8RN6IOkHJjggVrqH9FCJLQG6JsxXJ6EAwfDmENWpN1pCOOUw";

const button = document.getElementById("talkButton");
const message = document.getElementById("message");
const statusText = document.getElementById("status");
const circle = document.getElementById("circle");

let synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  if ('speechSynthesis' in window) {
    voices = synth.getVoices();
  }
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

// ১. পুরুষ কণ্ঠে বাংলা আউটপুট (মফিজ)
function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;

  synth.cancel();

  const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = "bn-BD"; // ফোনের ডিফল্ট বাংলাদেশি পুরুষ কণ্ঠ
  utterance.rate = 0.95;

  let maleVoice = voices.find(v => v.lang.includes("bn") || v.lang.includes("BN"));
  if (maleVoice) {
    utterance.voice = maleVoice;
  }

  utterance.onstart = function() {
    circle.classList.add("speaking");
    statusText.innerText = "MOFIZ SPEAKING";
  };

  utterance.onend = function() {
    circle.classList.remove("speaking");
    statusText.innerText = "MOFIZ ONLINE";
  };

  utterance.onerror = function() {
    circle.classList.remove("speaking");
    statusText.innerText = "MOFIZ ONLINE";
  };

  synth.speak(utterance);
}

// ২. বাংলা স্পিচ রিকগনিশন
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (!SpeechRecognition) {
  message.innerText = "দয়া করে Google Chrome ব্রাউজার ব্যবহার করুন।";
  button.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = "bn-BD"; 
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){
    button.innerText = "🔴 শুনছি...";
    button.classList.add("listening");
    statusText.innerText = "MOFIZ LISTENING";
  };

  recognition.onresult = function(event){
    const userSpeech = event.results[0][0].transcript.trim();
    message.innerText = "আপনি: " + userSpeech;
    askGeminiAI(userSpeech);
  };

  recognition.onerror = function(){
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");
    statusText.innerText = "MOFIZ ONLINE";
    message.innerText = "আবার চেষ্টা করুন।";
  };

  recognition.onend = function(){
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");
  };
}

button.addEventListener("click", function(){
  if(recognition) {
    try { recognition.start(); } catch(e){}
  }
});

// ৩. Gemini AI (মফিজের পার্সোনালিটি প্রম্পট)
async function askGeminiAI(userQuery) {
  button.innerText = "🤔 ভাবছি...";
  button.classList.add("thinking");
  statusText.innerText = "MOFIZ THINKING";

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

  const promptText = `তুমি একজন অত্যন্ত বুদ্ধিমান, অমায়িক এবং নির্ভরযোগ্য পুরুষ এআই অ্যাসিস্ট্যান্ট, তোমার নাম 'মফিজ' (Mofiz)। তুমি সবসময় ব্যবহারকারীর সাথে পুরুষ হিসেবে বিনয়ী ও বন্ধুসুলভভাবে বাংলায় কথা বলবে। সবসময় সংক্ষিপ্ত ও প্রাকটিক্যাল উত্তর দেবে যা ২ থেকে ৩ বাক্যের মধ্যে সীমাবদ্ধ থাকে। প্রশ্ন: ${userQuery}`;

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{
          parts: [{ text: promptText }]
        }]
      })
    });

    const data = await response.json();
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("thinking");

    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
      const aiReply = data.candidates[0].content.parts[0].text.trim();
      message.innerText = "মফিজ: " + aiReply;
      speak(aiReply);
    } else {
      const fallback = "দুঃখিত ভাই, আমি বিষয়টি বুঝতে পারিনি। আবার বলবেন?";
      message.innerText = "মফিজ: " + fallback;
      speak(fallback);
    }

  } catch (error) {
    console.error("AI Error:", error);
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("thinking");
    const errorMsg = "এআই সার্ভারের সাথে সংযোগ করা যাচ্ছে না। API Key ঠিক আছে কিনা দেখুন।";
    message.innerText = "মফিজ: " + errorMsg;
    speak(errorMsg);
  }
}
</script>

</body>
</html>
