<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERIS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#05070c;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:25px;
}

h1{
  font-size:42px;
  letter-spacing:8px;
  margin-bottom:5px;
}

.status{
  color:#00eaff;
  font-size:14px;
  letter-spacing:3px;
  margin-bottom:45px;
}

.circle{
  width:220px;
  height:220px;
  margin:auto;
  border-radius:50%;
  border:2px solid #00eaff;
  box-shadow:0 0 20px #00eaff,
             0 0 60px rgba(0,234,255,.35),
             inset 0 0 40px rgba(0,234,255,.2);
  display:flex;
  justify-content:center;
  align-items:center;
}

.inner{
  width:150px;
  height:150px;
  border-radius:50%;
  background:#07121a;
  border:1px solid #00eaff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  letter-spacing:4px;
}

.message{
  min-height:60px;
  margin-top:40px;
  font-size:18px;
  line-height:1.6;
}

button{
  margin-top:25px;
  padding:15px 30px;
  border:none;
  border-radius:30px;
  background:#00eaff;
  color:#001015;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.96);
}

.listening{
  background:#ff3158;
  color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>AERIS</h1>

<div class="status" id="status">
AERIS ONLINE
</div>

<div class="circle">
  <div class="inner">
    AERIS
  </div>
</div>

<div class="message" id="message">
বাংলায় কথা বলুন...
</div>

<button id="talkButton">
🎙️ কথা বলুন
</button>

</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

const button =
document.getElementById("talkButton");

const message =
document.getElementById("message");

const statusText =
document.getElementById("status");

let recognition = null;
let synthesizer = null;
let loadingTTS = false;


/* =========================
   BENGALI TTS
========================= */

async function loadVoice(){

  if(synthesizer || loadingTTS){
    return;
  }

  loadingTTS = true;

  statusText.innerText =
  "AERIS VOICE LOADING...";

  message.innerText =
  "বাংলা ভয়েস প্রস্তুত হচ্ছে... প্রথমবার কিছুটা সময় লাগতে পারে।";

  try{

    synthesizer = await pipeline(
      "text-to-audio",
      "naklitechie/mms-tts-bn-ONNX"
    );

    statusText.innerText =
    "AERIS ONLINE";

    message.innerText =
    "বাংলা ভয়েস প্রস্তুত।";

  }catch(error){

    console.error(error);

    synthesizer = null;

    statusText.innerText =
    "VOICE ERROR";

    message.innerText =
    "বাংলা ভয়েস লোড করা যায়নি।";

  }

  loadingTTS = false;
}


/* =========================
   SPEAK
========================= */

async function speak(text){

  try{

    if(!synthesizer){

      await loadVoice();

    }

    if(!synthesizer){
      return;
    }

    statusText.innerText =
    "AERIS SPEAKING...";

    const output =
    await synthesizer(text);

    const audioBlob =
    output.toBlob();

    const audioURL =
    URL.createObjectURL(audioBlob);

    const audio =
    new Audio(audioURL);

    audio.onended = function(){

      URL.revokeObjectURL(audioURL);

      statusText.innerText =
      "AERIS ONLINE";

    };

    await audio.play();

  }catch(error){

    console.error(error);

    statusText.innerText =
    "AERIS ONLINE";

    message.innerText =
    "উত্তর তৈরি হয়েছে, কিন্তু ভয়েস চালু করা যায়নি।";

  }

}


/* =========================
   SPEECH RECOGNITION
========================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

  message.innerText =
  "এই ব্রাউজারে Speech Recognition নেই।";

  button.disabled = true;

}else{

  recognition =
  new SpeechRecognition();

  recognition.lang =
  "bn-BD";

  recognition.continuous =
  false;

  recognition.interimResults =
  false;


  recognition.onstart = function(){

    button.innerText =
    "🔴 শুনছি...";

    button.classList.add(
      "listening"
    );

    statusText.innerText =
    "AERIS LISTENING";

  };


  recognition.onresult =
  function(event){

    const text =
    event.results[0][0].transcript.trim();

    message.innerText =
    "আপনি: " + text;

    reply(text);

  };


  recognition.onerror =
  function(event){

    console.log(
      "Recognition error:",
      event.error
    );

    resetButton();

    if(
      event.error ===
      "not-allowed"
    ){

      message.innerText =
      "মাইক্রোফোনের অনুমতি দিন।";

    }else{

      message.innerText =
      "আবার চেষ্টা করুন।";

    }

  };


  recognition.onend =
  function(){

    resetButton();

  };

}


/* =========================
   BUTTON
========================= */

button.addEventListener(
  "click",
  function(){

    if(!recognition){
      return;
    }

    try{

      recognition.start();

    }catch(error){

      console.log(error);

    }

  }
);


function resetButton(){

  button.innerText =
  "🎙️ কথা বলুন";

  button.classList.remove(
    "listening"
  );

  statusText.innerText =
  "AERIS ONLINE";

}


/* =========================
   AERIS REPLY
========================= */

function reply(text){

  let answer = "";

  if(
    text.includes("হ্যালো") ||
    text.includes("হাই")
  ){

    answer =
    "হ্যালো! আমি এরিস। আপনাকে কীভাবে সাহায্য করতে পারি?";

  }

  else if(
    text.includes("কেমন আছো") ||
    text.includes("কেমন আছেন")
  ){

    answer =
    "আমি ভালো আছি। আপনার সাথে কথা বলতে প্রস্তুত।";

  }

  else if(
    text.includes("তোমার নাম") ||
    text.includes("আপনার নাম") ||
    text.includes("নাম কি")
  ){

    answer =
    "আমার নাম এরিস।";

  }

  else if(
    text.includes("কে তুমি") ||
    text.includes("তুমি কে")
  ){

    answer =
    "আমি এরিস, আপনার AI সহকারী।";

  }

  else if(
    text.includes("ধন্যবাদ")
  ){

    answer =
    "আপনাকেও ধন্যবাদ।";

  }

  else{

    answer =
    "আমি আপনার কথা বুঝতে পেরেছি।";

  }


  message.innerText =
  "AERIS: " + answer;

  speak(answer);

}

</script>

</body>
</html>
