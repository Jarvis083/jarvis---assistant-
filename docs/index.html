<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERIS - AI Assistant</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#05070c;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:25px;
}

h1{
  font-size:42px;
  letter-spacing:8px;
  margin-bottom:5px;
}

.status{
  color:#00eaff;
  font-size:14px;
  letter-spacing:3px;
  margin-bottom:45px;
}

.circle{
  width:220px;
  height:220px;
  margin:auto;
  border-radius:50%;
  border:2px solid #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    0 0 60px rgba(0,234,255,.35),
    inset 0 0 40px rgba(0,234,255,.2);

  display:flex;
  justify-content:center;
  align-items:center;
  transition: all 0.3s ease;
}

.inner{
  width:150px;
  height:150px;
  border-radius:50%;
  background:#07121a;
  border:1px solid #00eaff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  letter-spacing:4px;
  box-shadow:0 0 30px rgba(0,234,255,.4);
}

.message{
  min-height:60px;
  margin-top:40px;
  font-size:18px;
  line-height:1.6;
}

button{
  margin-top:25px;
  padding:15px 30px;
  border:none;
  border-radius:30px;
  background:#00eaff;
  color:#001015;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition: 0.2s;
}

button:active{
  transform:scale(.96);
}

.listening{
  background:#ff3158;
  color:white;
}

.speaking {
  animation: pulse 1.2s infinite ease-in-out;
  border-color: #00ffaa;
  box-shadow: 0 0 30px #00ffaa, 0 0 80px rgba(0,255,170,.4);
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">

  <h1>AERIS</h1>

  <div class="status" id="status">
    AERIS ONLINE
  </div>

  <div class="circle" id="circle">
    <div class="inner" id="core">
      AERIS
    </div>
  </div>

  <div class="message" id="message">
    বাংলায় কথা বলুন...
  </div>

  <button id="talkButton">
    🎙️ কথা বলুন
  </button>

</div>

<script>

const button = document.getElementById("talkButton");
const message = document.getElementById("message");
const statusText = document.getElementById("status");
const circle = document.getElementById("circle");

// ১. ভয়েস প্রিপেয়ার এবং সাউন্ড অন করার ফিক্স
let synth = window.speechSynthesis;
let voices = [];

function populateVoices() {
  if(synth) {
    voices = synth.getVoices();
  }
}

populateVoices();
if (synth && synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = populateVoices;
}

// ২. স্পিচ ফাংশন (গ্যারান্টিড ভয়েস আউটপুট)
function speak(text) {
  if (!synth) return;

  // আগের কথা বন্ধ করা
  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  
  // বাংলা ভয়েস নির্বাচন করার চেষ্টা করা
  let banglaVoice = voices.find(v => v.lang.includes('bn') || v.lang.includes('BD'));
  if (banglaVoice) {
    utterance.voice = banglaVoice;
  }

  utterance.lang = "bn-BD"; 
  utterance.rate = 0.9; 
  utterance.pitch = 1.0;

  utterance.onstart = function() {
    circle.classList.add("speaking");
    statusText.innerText = "AERIS SPEAKING";
  };

  utterance.onend = function() {
    circle.classList.remove("speaking");
    statusText.innerText = "AERIS ONLINE";
  };

  utterance.onerror = function() {
    circle.classList.remove("speaking");
    statusText.innerText = "AERIS ONLINE";
  };

  synth.speak(utterance);
}

// ৩. স্পিচ রিকগনিশন
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if (!SpeechRecognition) {
  message.innerText = "আপনার ব্রাউজারে Speech Recognition সাপোর্ট নেই। Google Chrome ব্যবহার করুন।";
  button.disabled = true;
} else {

  recognition = new SpeechRecognition();
  recognition.lang = "bn-BD";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){
    button.innerText = "🔴 শুনছি...";
    button.classList.add("listening");
    statusText.innerText = "AERIS LISTENING";
  };

  recognition.onresult = function(event){
    const text = event.results[0][0].transcript.trim();
    message.innerText = "আপনি: " + text;
    reply(text);
  };

  recognition.onerror = function(event){
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");
    statusText.innerText = "AERIS ONLINE";

    if(event.error === "not-allowed"){
      message.innerText = "মাইক্রোফোন অনুমতি দেওয়া হয়নি।";
    } else {
      message.innerText = "কথা বোঝা যায়নি, আবার চেষ্টা করুন।";
    }
  };

  recognition.onend = function(){
    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");
  };
}

// ৪. বাটন ক্লিক করলেই মোবাইলের অডিও ইঞ্জিন আনলক করার ফিক্স
button.addEventListener("click", function(){
  if(!recognition) return;

  // অডিও পারমিশন রেজ্যুম
  if (synth && synth.speaking) {
    synth.cancel();
  }
  
  // একটি খালি ডামি অডিও প্লে করে স্পিকার অ্যাক্টিভ করা
  let dummy = new SpeechSynthesisUtterance("");
  synth.speak(dummy);

  try{
    recognition.start();
  }catch(error){
    console.log(error);
  }
});

// ৫. উত্তর লজিক
function reply(text){
  let answer = "";

  if(text.includes("হ্যালো") || text.includes("হাই") || text.includes("হেলো")){
    answer = "হ্যালো! আমি এরিস। আপনাকে কীভাবে সাহায্য করতে পারি?";
  }
  else if(text.includes("কেমন")){
    answer = "আমি ভালো আছি। আপনার দিনটি কেমন যাচ্ছে?";
  }
  else if(text.includes("নাম")){
    answer = "আমার নাম এরিস।";
  }
  else if(text.includes("কে তুমি") || text.includes("তুমি কে")){
    answer = "আমি এরিস, আপনার এআই সহকারী।";
  }
  else if(text.includes("সময়") || text.includes("কয়টা") || text.includes("বাজে")){
    const now = new Date();
    const timeString = now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
    answer = "এখন সময় " + timeString;
  }
  else if(text.includes("তারিখ") || text.includes("দিন")){
    const now = new Date();
    const dateString = now.toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    answer = "আজকে " + dateString;
  }
  else if(text.includes("ধন্যবাদ")){
    answer = "আপনাকেও অনেক ধন্যবাদ!";
  }
  else{
    answer = "আমি আপনার কথা শুনতে পেয়েছি।";
  }

  message.innerText = "AERIS: " + answer;
  
  // ১ সেকেন্ড বাদে কথা বলার ফাংশন চালু করা যেন রেসপন্স মসৃণ হয়
  setTimeout(() => {
    speak(answer);
  }, 300);
}

</script>

</body>
</html>
