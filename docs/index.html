<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOFIZ - AI Assistant</title>

<style>
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; background:#05070c; color:white;
  font-family:Arial,sans-serif; display:flex; justify-content:center;
  align-items:center; text-align:center;
}
.container{ width:100%; max-width:500px; padding:25px; }
h1{ font-size:42px; letter-spacing:8px; margin-bottom:5px; color:#00eaff; }
.status{ color:#00eaff; font-size:14px; letter-spacing:3px; margin-bottom:45px; }
.circle{
  width:220px; height:220px; margin:auto; border-radius:50%;
  border:2px solid #00eaff;
  box-shadow: 0 0 20px #00eaff, 0 0 60px rgba(0,234,255,.35), inset 0 0 40px rgba(0,234,255,.2);
  display:flex; justify-content:center; align-items:center; transition: all 0.3s ease;
}
.inner{
  width:150px; height:150px; border-radius:50%; background:#07121a;
  border:1px solid #00eaff; display:flex; justify-content:center; align-items:center;
  font-size:22px; font-weight:bold; letter-spacing:3px; box-shadow:0 0 30px rgba(0,234,255,.4);
}
.message{ min-height:60px; margin-top:40px; font-size:18px; line-height:1.6; word-break: break-word; }
button{
  margin-top:25px; padding:15px 30px; border:none; border-radius:30px;
  background:#00eaff; color:#001015; font-size:17px; font-weight:bold; cursor:pointer;
  transition: 0.2s;
}
button:active{ transform:scale(.96); }
.listening{ background:#ff3158; color:white; }
.thinking{ background:#ffb700; color:#000; }
.speaking {
  animation: pulse 1.2s infinite ease-in-out;
  border-color: #00ffaa;
  box-shadow: 0 0 30px #00ffaa, 0 0 80px rgba(0,255,170,.4);
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
  <h1>MOFIZ</h1>
  <div class="status" id="status">MOFIZ ONLINE</div>
  <div class="circle" id="circle">
    <div class="inner" id="core">MOFIZ</div>
  </div>
  <div class="message" id="message">কথা বলতে বাটনে চাপুন...</div>
  <button id="talkButton">🎙️ কথা বলুন</button>
</div>

<script>
  const GEMINI_API_KEY = "AQ.Ab8RN6IOkHJjggVrqH9FCJLQG6JsxXJ6EAwfDmENWpN1pCOOUw";

  const button = document.getElementById("talkButton");
  const message = document.getElementById("message");
  const statusText = document.getElementById("status");
  const circle = document.getElementById("circle");

  let synth = window.speechSynthesis;
  let voices = [];

  function loadVoices() {
    if ('speechSynthesis' in window) {
      voices = synth.getVoices();
    }
  }
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text) {
    if (!text || !('speechSynthesis' in window)) return;
    synth.cancel();

    const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}]/gu, '');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "bn-BD";
    utterance.rate = 0.95;

    let bnVoice = voices.find(v => v.lang.includes("bn") || v.lang.includes("BN"));
    if (bnVoice) {
      utterance.voice = bnVoice;
    }

    utterance.onstart = function() {
      circle.classList.add("speaking");
      statusText.innerText = "MOFIZ SPEAKING";
    };

    utterance.onend = function() {
      circle.classList.remove("speaking");
      statusText.innerText = "MOFIZ ONLINE";
    };

    utterance.onerror = function() {
      circle.classList.remove("speaking");
      statusText.innerText = "MOFIZ ONLINE";
    };

    synth.speak(utterance);
  }

  // Gemini API থেকে উত্তর আনার ফাংশন
  async function askGemini(userText) {
    message.innerText = "মফিজ চিন্তা করছে...";
    statusText.innerText = "MOFIZ THINKING";

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: {
            parts: [{ text: "তোমার নাম মফিজ। তুমি একজন বাংলা ভয়েস অ্যাসিস্ট্যান্ট। ছোট এবং বন্ধুত্বপূর্ণ বাংলায় উত্তর দাও।" }]
          },
          contents: [{
            parts: [{ text: userText }]
          }]
        })
      });

      const data = await response.json();
      
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        let aiReply = data.candidates[0].content.parts[0].text;
        message.innerText = aiReply;
        speak(aiReply);
      } else {
        throw new Error("No response text");
      }
    } catch (error) {
      console.error(error);
      let errorMsg = "দুঃখিত, এপিআই সংযোগে কোনো সমস্যা হচ্ছে।";
      message.innerText = errorMsg;
      speak(errorMsg);
    }
  }

  // কথা শোনার ফাংশন (Speech Recognition)
  function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই। গুগল ক্রোম ব্যবহার করুন।");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'bn-BD';
    recognition.interimResults = false;

    recognition.onstart = function() {
      statusText.innerText = "MOFIZ LISTENING...";
      message.innerText = "আমি শুনছি, বলুন...";
    };

    recognition.onresult = function(event) {
      const userSpeech = event.results[0][0].transcript;
      message.innerText = "আপনি বলেছেন: " + userSpeech;
      askGemini(userSpeech);
    };

    recognition.onerror = function() {
      statusText.innerText = "MOFIZ ONLINE";
      message.innerText = "আমি কিছু শুনতে পাইনি, আবার চেষ্টা করুন।";
    };

    recognition.start();
  }

  button.addEventListener("click", startListening);
</script>
