<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERIS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:#05080d;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:90%;
max-width:500px;
text-align:center;
}

h1{
font-size:48px;
letter-spacing:10px;
color:#00d9ff;
text-shadow:0 0 20px #00d9ff;
}

.status{
color:#00d9ff;
letter-spacing:2px;
}

.circle{
width:200px;
height:200px;
margin:50px auto;
border:2px solid #00d9ff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 30px #00d9ff;
}

.inner{
width:120px;
height:120px;
border:2px solid white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
color:#00d9ff;
}

.message{
padding:20px;
border:1px solid #183746;
border-radius:12px;
background:#081018;
margin-bottom:20px;
line-height:1.6;
}

button{
padding:14px 30px;
border-radius:30px;
border:1px solid #00d9ff;
background:transparent;
color:#00d9ff;
font-size:16px;
cursor:pointer;
}

button:disabled{
opacity:.5;
}
</style>
</head>

<body>

<div class="container">

<h1>AERIS</h1>

<div class="status" id="status">
AERIS ONLINE
</div>

<div class="circle">
<div class="inner" id="core">
AERIS
</div>
</div>

<div class="message" id="message">
প্রথমবার ভয়েস প্রস্তুত হতে কিছু সময় লাগতে পারে।
</div>

<button id="talkButton" onclick="listen()">
🎙️ কথা বলুন
</button>

</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


let synthesizer = null;


/* =========================
   AERIS VOICE ENGINE
========================= */

async function loadVoice(){

    if(synthesizer){
        return true;
    }

    document.getElementById("status").innerText =
    "AERIS ভয়েস প্রস্তুত করছে...";

    document.getElementById("core").innerText =
    "LOAD";

    try{

        synthesizer = await pipeline(
            "text-to-speech",
            "facebook/mms-tts-ben"
        );

        document.getElementById("status").innerText =
        "AERIS ONLINE";

        document.getElementById("core").innerText =
        "AERIS";

        return true;

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
        "VOICE ERROR";

        document.getElementById("message").innerText =
        "বাংলা ভয়েস লোড করা যায়নি।";

        document.getElementById("core").innerText =
        "ERROR";

        return false;
    }
}


/* =========================
   SPEAK
========================= */

async function speak(text){

    const ready = await loadVoice();

    if(!ready){
        return;
    }

    try{

        document.getElementById("status").innerText =
        "AERIS কথা বলছে...";

        document.getElementById("core").innerText =
        "SPEAK";

        const output =
        await synthesizer(text);

        const blob =
        output.toBlob();

        const audioURL =
        URL.createObjectURL(blob);

        const audio =
        new Audio(audioURL);

        audio.onended = function(){

            URL.revokeObjectURL(audioURL);

            document.getElementById("status").innerText =
            "AERIS ONLINE";

            document.getElementById("core").innerText =
            "AERIS";
        };

        await audio.play();

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
        "VOICE ERROR";

        document.getElementById("message").innerText =
        "ভয়েস চালু করা যায়নি।";

        document.getElementById("core").innerText =
        "ERROR";
    }
}


/* =========================
   LISTEN
========================= */

function listen(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        document.getElementById("message").innerText =
        "এই ব্রাউজারে Speech Recognition নেই।";

        return;
    }

    const recognition =
    new SpeechRecognition();

    recognition.lang = "bn-BD";
    recognition.continuous = false;
    recognition.interimResults = false;

    document.getElementById("status").innerText =
    "AERIS শুনছে...";

    document.getElementById("core").innerText =
    "LISTEN";

    recognition.start();


    recognition.onresult = async function(event){

        const text =
        event.results[0][0].transcript;

        let reply =
        "দুঃখিত, আমি এখনো এই প্রশ্নের উত্তর জানি না।";


        if(
        text.includes("হ্যালো") ||
        text.includes("হাই")
        ){

            reply =
            "হ্যালো! আমি এরিস। আপনাকে কীভাবে সাহায্য করতে পারি।";
        }

        else if(
        text.includes("কেমন আছো") ||
        text.includes("কেমন আছেন")
        ){

            reply =
            "আমি ভালো আছি। আপনার সাথে কথা বলতে প্রস্তুত।";
        }

        else if(
        text.includes("তোমার নাম") ||
        text.includes("আপনার নাম") ||
        text.includes("নাম কি")
        ){

            reply =
            "আমার নাম এরিস।";
        }

        else if(
        text.includes("কে তুমি") ||
        text.includes("তুমি কে")
        ){

            reply =
            "আমি এরিস, আপনার বাংলা AI সহকারী।";
        }

        else if(
        text.includes("ধন্যবাদ")
        ){

            reply =
            "আপনাকেও ধন্যবাদ।";
        }


        document.getElementById("message").innerText =
        reply;

        document.getElementById("status").innerText =
        "AERIS উত্তর প্রস্তুত করছে...";

        document.getElementById("core").innerText =
        "THINK";


        await speak(reply);
    };


    recognition.onerror = function(event){

        document.getElementById("status").innerText =
        "AERIS ERROR";

        document.getElementById("message").innerText =
        "সমস্যা: " + event.error;

        document.getElementById("core").innerText =
        "ERROR";
    };


    recognition.onend = function(){

        if(
        document.getElementById("status").innerText ===
        "AERIS শুনছে..."
        ){

            document.getElementById("status").innerText =
            "AERIS ONLINE";

            document.getElementById("core").innerText =
            "AERIS";
        }
    };
}

</script>

</body>
</html>
