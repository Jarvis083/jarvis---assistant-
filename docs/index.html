<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERIS</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#05080d;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
}

h1{
    font-size:48px;
    letter-spacing:10px;
    color:#00d9ff;
    text-shadow:0 0 20px #00d9ff;
}

.status{
    color:#00d9ff;
    letter-spacing:2px;
}

.circle{
    width:200px;
    height:200px;
    margin:50px auto;
    border:2px solid #00d9ff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 30px #00d9ff;
}

.inner{
    width:120px;
    height:120px;
    border:2px solid white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#00d9ff;
}

.message{
    padding:20px;
    border:1px solid #183746;
    border-radius:12px;
    background:#081018;
    margin-bottom:20px;
    line-height:1.6;
}

button{
    padding:14px 30px;
    border-radius:30px;
    border:1px solid #00d9ff;
    background:transparent;
    color:#00d9ff;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>AERIS</h1>

<div class="status" id="status">
AERIS ONLINE
</div>

<div class="circle">
<div class="inner" id="core">
AERIS
</div>
</div>

<div class="message" id="message">
বাংলায় কথা বলুন...
</div>

<button onclick="listen()">
🎙️ কথা বলুন
</button>

</div>

<script>

function listen(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

document.getElementById("message").innerText =
"এই ব্রাউজারে বাংলা Speech Recognition নেই।";

return;
}

const recognition = new SpeechRecognition();

recognition.lang = "bn-BD";
recognition.continuous = false;
recognition.interimResults = false;

document.getElementById("status").innerText =
"AERIS শুনছে...";

document.getElementById("core").innerText =
"LISTEN";

recognition.start();

recognition.onresult = function(event){

const text =
event.results[0][0].transcript;

document.getElementById("message").innerText =
"আপনি বলেছেন: " + text;

document.getElementById("status").innerText =
"AERIS বুঝেছে";

document.getElementById("core").innerText =
"OK";
};

recognition.onerror = function(event){

document.getElementById("status").innerText =
"AERIS ERROR";

document.getElementById("message").innerText =
"সমস্যা: " + event.error;

document.getElementById("core").innerText =
"ERROR";
};

recognition.onend = function(){

setTimeout(function(){

document.getElementById("status").innerText =
"AERIS ONLINE";

document.getElementById("core").innerText =
"AERIS";

},1000);

};

}

</script>

</body>
</html>
