<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERIS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#05070c;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:25px;
}

h1{
  font-size:42px;
  letter-spacing:8px;
  margin-bottom:5px;
}

.status{
  color:#00eaff;
  font-size:14px;
  letter-spacing:3px;
  margin-bottom:45px;
}

.circle{
  width:220px;
  height:220px;
  margin:auto;
  border-radius:50%;
  border:2px solid #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    0 0 60px rgba(0,234,255,.35),
    inset 0 0 40px rgba(0,234,255,.2);

  display:flex;
  justify-content:center;
  align-items:center;
}

.inner{
  width:150px;
  height:150px;
  border-radius:50%;
  background:#07121a;
  border:1px solid #00eaff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  letter-spacing:4px;
  box-shadow:0 0 30px rgba(0,234,255,.4);
}

.message{
  min-height:60px;
  margin-top:40px;
  font-size:18px;
  line-height:1.6;
}

button{
  margin-top:25px;
  padding:15px 30px;
  border:none;
  border-radius:30px;
  background:#00eaff;
  color:#001015;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

.listening{
  background:#ff3158;
  color:white;
}
</style>
</head>

<body>

<div class="container">

  <h1>AERIS</h1>

  <div class="status" id="status">
    AERIS ONLINE
  </div>

  <div class="circle">
    <div class="inner" id="core">
      AERIS
    </div>
  </div>

  <div class="message" id="message">
    বাংলায় কথা বলুন...
  </div>

  <button id="talkButton">
    🎙️ কথা বলুন
  </button>

</div>

<script>

const button = document.getElementById("talkButton");
const message = document.getElementById("message");
const statusText = document.getElementById("status");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if (!SpeechRecognition) {

  message.innerText =
    "আপনার ব্রাউজারে Speech Recognition সাপোর্ট নেই।";

  button.disabled = true;

} else {

  recognition = new SpeechRecognition();

  recognition.lang = "bn-BD";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){

    button.innerText = "🔴 শুনছি...";
    button.classList.add("listening");

    statusText.innerText = "AERIS LISTENING";

  };

  recognition.onresult = function(event){

    const text =
      event.results[0][0].transcript.trim();

    message.innerText = "আপনি: " + text;

    reply(text);

  };

  recognition.onerror = function(event){

    console.log("Speech error:", event.error);

    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");

    statusText.innerText = "AERIS ONLINE";

    if(event.error === "not-allowed"){

      message.innerText =
        "মাইক্রোফোন অনুমতি দেওয়া হয়নি।";

    }else{

      message.innerText =
        "আবার চেষ্টা করুন।";

    }

  };

  recognition.onend = function(){

    button.innerText = "🎙️ কথা বলুন";
    button.classList.remove("listening");

    statusText.innerText = "AERIS ONLINE";

  };

}

button.addEventListener("click", function(){

  if(!recognition) return;

  try{

    recognition.start();

  }catch(error){

    console.log(error);

  }

});


function reply(text){

  let answer = "";

  if(
    text.includes("হ্যালো") ||
    text.includes("হাই")
  ){

    answer =
      "হ্যালো! আমি এরিস। আপনাকে কীভাবে সাহায্য করতে পারি?";

  }

  else if(
    text.includes("কেমন আছো") ||
    text.includes("কেমন আছেন")
  ){

    answer =
      "আমি ভালো আছি। আপনার সাথে কথা বলতে প্রস্তুত।";

  }

  else if(
    text.includes("তোমার নাম") ||
    text.includes("আপনার নাম") ||
    text.includes("নাম কি")
  ){

    answer =
      "আমার নাম এরিস।";

  }

  else if(
    text.includes("কে তুমি") ||
    text.includes("তুমি কে")
  ){

    answer =
      "আমি এরিস, আপনার AI সহকারী।";

  }

  else if(
    text.includes("ধন্যবাদ")
  ){

    answer =
      "আপনাকেও ধন্যবাদ।";

  }

  else{

    answer =
      "আমি আপনার কথা বুঝতে পেরেছি।";

  }

  message.innerText = "AERIS: " + answer;

}

</script>

</body>
</html>
