<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS বাংলা Voice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#05080d;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
}

h1{
    color:#00d9ff;
    letter-spacing:5px;
    margin-bottom:8px;
}

.subtitle{
    color:#8ca5b5;
    margin-bottom:30px;
}

textarea{
    width:100%;
    height:130px;
    padding:15px;
    border-radius:15px;
    border:1px solid #00d9ff;
    background:#081018;
    color:white;
    font-size:18px;
    resize:none;
    outline:none;
}

button{
    margin-top:20px;
    padding:15px 35px;
    border:1px solid #00d9ff;
    border-radius:30px;
    background:transparent;
    color:#00d9ff;
    font-size:17px;
}

button:disabled{
    opacity:.5;
}

#status{
    margin-top:25px;
    color:#00d9ff;
    font-size:14px;
}

.circle{
    width:110px;
    height:110px;
    margin:0 auto 30px;
    border-radius:50%;
    border:2px solid #00d9ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00d9ff;
    box-shadow:0 0 25px rgba(0,217,255,.5);
}
</style>
</head>

<body>

<div class="container">

    <h1>JARVIS</h1>

    <div class="subtitle">
        বাংলা AI VOICE
    </div>

    <div class="circle">
        VOICE
    </div>

    <textarea id="text">হ্যালো, আমি জার্ভিস। আপনাকে কীভাবে সাহায্য করতে পারি?</textarea>

    <br>

    <button id="speakButton">
        🔊 কথা বলুন
    </button>

    <div id="status">
        READY
    </div>

</div>

<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const button =
document.getElementById("speakButton");

const textBox =
document.getElementById("text");

const status =
document.getElementById("status");

let synthesizer = null;

button.addEventListener("click", async () => {

    try {

        button.disabled = true;

        status.innerText =
        "VOICE MODEL LOADING...";

        if (!synthesizer) {

            synthesizer = await pipeline(
                "text-to-speech",
                "Xenova/mms-tts-ben"
            );

        }

        status.innerText =
        "VOICE GENERATING...";

        const output =
        await synthesizer(textBox.value);

        const audio =
        new Audio(
            URL.createObjectURL(
                output.toBlob()
            )
        );

        audio.onended = () => {

            status.innerText =
            "READY";

            button.disabled = false;

        };

        audio.onerror = () => {

            status.innerText =
            "AUDIO ERROR";

            button.disabled = false;

        };

        await audio.play();

    } catch(error) {

        console.error(error);

        status.innerText =
        "ERROR: " + error.message;

        button.disabled = false;

    }

});

</script>

</body>
</html>
