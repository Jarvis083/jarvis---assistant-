<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS বাংলা Voice</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:#05080d;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

.jarvis{
width:90%;
max-width:500px;
text-align:center;
}

h1{
margin:0;
font-size:32px;
letter-spacing:5px;
color:#00d9ff;
text-shadow:0 0 15px #00d9ff;
}

.subtitle{
margin-top:10px;
color:#8da4b3;
font-size:14px;
}

textarea{
width:100%;
height:130px;
margin-top:35px;
padding:18px;
background:#081018;
border:1px solid #00d9ff;
border-radius:15px;
color:white;
font-size:18px;
outline:none;
resize:none;
}

button{
margin-top:20px;
padding:15px 35px;
border:1px solid #00d9ff;
background:transparent;
color:#00d9ff;
border-radius:30px;
font-size:17px;
cursor:pointer;
box-shadow:0 0 12px rgba(0,217,255,.3);
}

button:active{
background:#00d9ff;
color:#000;
}

#status{
margin-top:25px;
color:#00d9ff;
font-size:14px;
letter-spacing:2px;
}

.circle{
width:120px;
height:120px;
margin:35px auto 0;
border-radius:50%;
border:2px solid #00d9ff;
display:flex;
align-items:center;
justify-content:center;
color:#00d9ff;
box-shadow:
0 0 15px #00d9ff,
0 0 40px rgba(0,217,255,.3);
animation:pulse 2s infinite;
}

@keyframes pulse{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.06);
}

}

</style>

</head>

<body>

<div class="jarvis">

<h1>JARVIS</h1>

<div class="subtitle">
বাংলা AI VOICE
</div>

<div class="circle">
VOICE
</div>

<textarea id="text">হ্যালো, আমি জার্ভিস। আপনাকে কীভাবে সাহায্য করতে পারি?</textarea>

<br>

<button id="speak">
🔊 কথা বলুন
</button>

<div id="status">
READY
</div>

</div>

<script>

const button =
document.getElementById("speak");

const text =
document.getElementById("text");

const status =
document.getElementById("status");

button.onclick = function(){

const message =
text.value;

if(!message){
return;
}

const voice =
new SpeechSynthesisUtterance(message);

voice.lang = "bn-BD";

voice.rate = 0.9;

voice.pitch = 0.8;

speechSynthesis.cancel();

status.innerText =
"SPEAKING...";

voice.onend = function(){

status.innerText =
"READY";

};

speechSynthesis.speak(voice);

};

</script>

</body>
</html>
