<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERIS</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:#05080d;
color:white;
font-family:Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
}

.app{
width:90%;
max-width:500px;
text-align:center;
}

h1{
font-size:42px;
letter-spacing:7px;
color:#00d9ff;
margin:0;
text-shadow:0 0 20px #00d9ff;
}

.subtitle{
margin-top:8px;
color:#9fb4c0;
}

.core{
width:180px;
height:180px;
margin:40px auto;
border:2px solid #00d9ff;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#00d9ff;
box-shadow:
0 0 20px #00d9ff,
0 0 60px rgba(0,217,255,.35);
animation:pulse 2s infinite;
}

@keyframes pulse{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

}

textarea{
width:100%;
height:120px;
padding:15px;
border-radius:15px;
border:1px solid #00d9ff;
background:#081018;
color:white;
font-size:18px;
outline:none;
resize:none;
}

button{
margin-top:20px;
padding:15px 35px;
border-radius:30px;
border:1px solid #00d9ff;
background:transparent;
color:#00d9ff;
font-size:17px;
}

button:disabled{
opacity:.5;
}

#status{
margin-top:20px;
color:#00d9ff;
font-size:14px;
letter-spacing:2px;
}

</style>

</head>

<body>

<div class="app">

<h1>AERIS</h1>

<div class="subtitle">
বাংলা AI ASSISTANT
</div>

<div class="core">
AERIS
</div>

<textarea id="text">হ্যালো। আমি এরিস। আপনাকে কীভাবে সাহায্য করতে পারি?</textarea>

<br>

<button id="speak">
🔊 কথা বলুন
</button>

<div id="status">
READY
</div>

</div>

<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const button =
document.getElementById("speak");

const text =
document.getElementById("text");

const status =
document.getElementById("status");

let speaker = null;

button.onclick = async function(){

try{

button.disabled = true;

status.innerText =
"VOICE MODEL LOADING...";

if(!speaker){

speaker = await pipeline(
"text-to-speech",
"Xenova/mms-tts-ben",
{
device:"wasm"
}
);

}

status.innerText =
"এরিস কথা বলছে...";

const result =
await speaker(text.value);

const audio =
new Audio();

audio.src =
URL.createObjectURL(
new Blob(
[
new Float32Array(result.audio)
],
{
type:"audio/wav"
}
)
);

audio.play();

audio.onended = function(){

status.innerText =
"READY";

button.disabled = false;

};

}catch(error){

console.log(error);

status.innerText =
"VOICE ERROR";

button.disabled = false;

}

};

</script>

</body>
</html>
