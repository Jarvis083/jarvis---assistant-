<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS Bengali Voice</title>

<style>
body{
margin:0;
min-height:100vh;
background:#05080d;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

.box{
width:90%;
max-width:500px;
text-align:center;
}

h1{
color:#00d9ff;
}

textarea{
width:100%;
height:120px;
padding:15px;
font-size:18px;
border-radius:10px;
box-sizing:border-box;
}

button{
margin-top:20px;
padding:15px 30px;
border:1px solid #00d9ff;
background:transparent;
color:#00d9ff;
border-radius:30px;
font-size:18px;
}

#status{
margin-top:20px;
color:#00d9ff;
}
</style>
</head>

<body>

<div class="box">

<h1>JARVIS বাংলা Voice</h1>

<textarea id="text">হ্যালো, আমি জার্ভিস।</textarea>

<br>

<button onclick="speak()">🔊 কথা বলুন</button>

<div id="status">READY</div>

</div>

<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

let synthesizer = null;

async function speak(){

const text =
document.getElementById("text").value;

const status =
document.getElementById("status");

try{

status.innerText =
"বাংলা Voice লোড হচ্ছে...";

if(!synthesizer){

synthesizer = await pipeline(
"text-to-audio",
"naklitechie/mms-tts-bn-ONNX",
{
dtype:"q8"
}
);

}

status.innerText =
"কথা তৈরি হচ্ছে...";

const output =
await synthesizer(text);

const audio =
new Audio();

const wav =
encodeWAV(
output.audio,
output.sampling_rate
);

audio.src =
URL.createObjectURL(
new Blob(
[wav],
{type:"audio/wav"}
)
);

await audio.play();

status.innerText =
"READY";

}catch(error){

console.error(error);

status.innerText =
"ERROR: " + error.message;

}

}

function encodeWAV(samples, sampleRate){

const buffer =
new ArrayBuffer(
44 + samples.length * 2
);

const view =
new DataView(buffer);

function writeString(offset,string){

for(let i=0;i<string.length;i++){

view.setUint8(
offset+i,
string.charCodeAt(i)
);

}

}

writeString(0,"RIFF");

view.setUint32(
4,
36 + samples.length * 2,
true
);

writeString(8,"WAVE");

writeString(12,"fmt ");

view.setUint32(16,16,true);

view.setUint16(20,1,true);

view.setUint16(22,1,true);

view.setUint32(
24,
sampleRate,
true
);

view.setUint32(
28,
sampleRate * 2,
true
);

view.setUint16(32,2,true);

view.setUint16(34,16,true);

writeString(36,"data");

view.setUint32(
40,
samples.length * 2,
true
);

let offset = 44;

for(let i=0;i<samples.length;i++){

const sample =
Math.max(
-1,
Math.min(1,samples[i])
);

view.setInt16(
offset,
sample < 0
? sample * 0x8000
: sample * 0x7fff,
true
);

offset += 2;

}

return buffer;

}

</script>

</body>
</html>
