<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERIS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#05080d;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

.app{
    width:90%;
    max-width:500px;
    text-align:center;
}

h1{
    margin:0;
    font-size:44px;
    letter-spacing:8px;
    color:#00d9ff;
    text-shadow:0 0 20px #00d9ff;
}

.subtitle{
    margin-top:10px;
    color:#9bb0bd;
    letter-spacing:2px;
}

.core{
    width:190px;
    height:190px;
    margin:45px auto;
    border:2px solid #00d9ff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00d9ff;
    font-size:24px;
    letter-spacing:4px;
    box-shadow:
        0 0 20px #00d9ff,
        0 0 60px rgba(0,217,255,.35);
    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}

.message{
    width:100%;
    min-height:100px;
    padding:20px;
    border:1px solid #183746;
    border-radius:15px;
    background:#081018;
    color:#d7e3e9;
    font-size:18px;
    line-height:1.6;
}

button{
    margin-top:22px;
    padding:15px 35px;
    border:1px solid #00d9ff;
    border-radius:30px;
    background:transparent;
    color:#00d9ff;
    font-size:17px;
}

button:active{
    background:#00d9ff;
    color:#000;
}

button:disabled{
    opacity:.5;
}

#status{
    margin-top:20px;
    color:#00d9ff;
    font-size:14px;
    letter-spacing:2px;
}

</style>

</head>

<body>

<div class="app">

<h1>AERIS</h1>

<div class="subtitle">
বাংলা AI ASSISTANT
</div>

<div class="core">
AERIS
</div>

<div class="message" id="message">
হ্যালো। আমি এরিস। আপনাকে কীভাবে সাহায্য করতে পারি?
</div>

<button id="speakButton">
🔊 এরিস কথা বলুন
</button>

<div id="status">
READY
</div>

</div>


<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";


const button =
document.getElementById("speakButton");

const message =
document.getElementById("message");

const status =
document.getElementById("status");


let synthesizer = null;


button.addEventListener("click", async function(){

    try{

        button.disabled = true;

        status.innerText =
        "VOICE MODEL LOADING...";


        if(!synthesizer){

            synthesizer =
            await pipeline(
                "text-to-audio",
                "naklitechie/mms-tts-bn-ONNX",
                {
                    dtype:"q8"
                }
            );

        }


        status.innerText =
        "এরিস কথা বলছে...";


        const output =
        await synthesizer(
            message.innerText
        );


        const audio =
        new Audio(
            output.toBlob()
        );


        audio.onended =
        function(){

            status.innerText =
            "READY";

            button.disabled = false;

        };


        await audio.play();


    }catch(error){

        console.error(error);

        status.innerText =
        "VOICE ERROR";

        button.disabled = false;

    }

});

</script>

</body>
</html>
